# Throwaway demo signing key, committed on purpose so anyone can reproduce a
# byte-comparable release build. NEVER ship a real app with this key — generate
# your own with:
#   keytool -genkeypair -keystore my.jks -alias mykey -keyalg RSA \
#           -keysize 2048 -validity 10950
storeFile=keystore/dcp-demo.jks
storePassword=dcpdemo
keyAlias=dcp
keyPassword=dcpdemo
